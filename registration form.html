<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
    <h1 class="form-title">Student Registration Form</h1>

    <!-- Tab Control using radio inputs -->
    <input type="radio" name="tab" id="loginTab" checked hidden>
    <input type="radio" name="tab" id="signupTab" hidden>

    <div class="tab-buttons">
        <label for="loginTab" class="tab-label">Login</label>
        <label for="signupTab" class="tab-label">Signup</label>
    </div>

    <!-- Login Form -->
    <div class="form login-form">
        <form>
            <input type="email" placeholder="Email" required />
            <input type="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Signup / Student Registration Form -->
    <div class="form signup-form">
        <form>
            <input type="text" placeholder="Full Name" required />
            <input type="email" placeholder="Email" required />
            <input type="text" placeholder="Student ID" required />
            <input type="text" placeholder="Course" required />
            <input type="password" placeholder="Password" required />
            <input type="password" placeholder="Confirm Password" required />
            <button type="submit">Register</button>
        </form>
    </div>
</div>

</body>
</html>
